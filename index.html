[hidden] { display: none !important; }

/* keyboard focus ring follows each control's own shape (it used to force a 10px radius, which squared off the round play button) */

.line:focus-visible { border-radius: 10px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(var(--edge), env(safe-area-inset-left, 0px)); padding-right: max(var(--edge), env(safe-area-inset-right, 0px)); }
.sheet .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- episode list ---------- */
/* no default 8px margin at the top of the page: in search mode and at the top of an episode the top bar must sit right on the
   top edge, or iOS 26 draws its soft blur under the status bar (WebKit only skips it for a solid bar touching the edge) */
body { margin-top: 0; }
#list { padding-block: calc(env(safe-area-inset-top, 0px) + 36px) 48px; }
.mast { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding-inline: 8px; }
.mast .tools { margin-left: auto; display: flex; align-items: center; gap: 4px; margin-right: -6px; }
.mast .refresh { color: var(--muted); }
.mast .lang { color: var(--muted); font-family: var(--f-latin); display: inline-flex; align-items: center; gap: 5px; padding: 0 11px 0 9px; }
.mast .lang svg { width: 16px; height: 16px; }
.mast .lang[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.mast .refresh.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.logo { width: 64px; height: 64px; flex: none; overflow: visible; margin-left: -4px; }
.logo .lg { font: 900 150px "Noto Sans KR", sans-serif; fill: #fff; text-anchor: middle; }
.logo .b2f { fill: var(--ink); stroke: var(--bg); stroke-width: 32px; paint-order: stroke; }
.logo .b2 text { fill: var(--bg); }
/* logo (7s loop): 서 springs in, 강 follows, both hold; 강 then 서 pop out (quick swell, snap to nothing),
   and 서 springs straight back in. Scale only, no fades. */
.logo .b1 { transform-origin: 90px 300px; animation: lgpop 7s infinite; }
.logo .b2 { transform-origin: 440px 464px; animation: lgpop2 7s infinite; }
@keyframes lgpop {
  0% { transform: scale(0); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  3% { transform: scale(1.18); animation-timing-function: ease-in-out; }
  5% { transform: scale(.93); animation-timing-function: ease-in-out; }
  7% { transform: scale(1.03); animation-timing-function: ease-in-out; }
  8.5%, 93% { transform: scale(1); animation-timing-function: ease-out; }
  95% { transform: scale(1.16); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
  97%, 100% { transform: scale(0); } }
@keyframes lgpop2 {
  0%, 6% { transform: scale(0); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  9% { transform: scale(1.18); animation-timing-function: ease-in-out; }
  11% { transform: scale(.93); animation-timing-function: ease-in-out; }
  13% { transform: scale(1.03); animation-timing-function: ease-in-out; }
  14.5%, 89% { transform: scale(1); animation-timing-function: ease-out; }
  91% { transform: scale(1.16); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
  93%, 100% { transform: scale(0); } }
@media (prefers-reduced-motion: reduce) { .logo .b1, .logo .b2 { animation: none; } }
.mast h1 { font: 800 clamp(24px, 7vw, 32px)/1.15 "Poppins", var(--f-display); margin: 0; letter-spacing: -.025em; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.mast .tools { flex: none; }   /* the buttons never get squeezed; a long wordmark (ポッドキャスト, Podcastler) shrinks instead, see fitMast */

.lvpick select { -webkit-appearance: none; appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font: 600 14px var(--f-body); letter-spacing: 0; text-transform: none; height: 36px; padding: 0 34px 0 14px; border-radius: 999px; }
.lvpick select { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
@media (hover: hover) { .lvpick select:hover { background-color: color-mix(in srgb, var(--ink) 4%, var(--surface)); } }
/* no browser focus ring after a mouse/touch open (it stayed lit once the menu closed); keyboard focus gets a soft accent ring

.lvpick select:focus { outline: none; }
.lvpick select:focus-visible { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.lvpick svg { position: absolute; right: 12px; width: 14px; height: 14px; pointer-events: none; color: var(--muted); }
.eps .lvl.pick { align-items: center; margin: 0 0 6px; }
.eps .lvl.pick .count { padding-right: 4px; }
.lvl { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 10px 8px 10px; display: flex; justify-content: space-between; }
.lvl .count { letter-spacing: .02em; text-transform: none; font-weight: 500; }
.eps { display: grid; gap: 10px; }
.eps .lvl { margin: 18px 8px 0; }
.eps .lvl:first-child { margin-top: 10px; }
.ep { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; width: 100%;
  padding: 14px 16px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px;
  box-shadow: 0 1px 2px rgba(23,24,31,.04); transition: transform .5s var(--spring); }
.ep:active { transform: scale(.975); transition: transform .1s ease-out; }
/* press feedback: things you tap dip a little and spring back when let go */
.ib, .chip, .play, .speed, .qx, .recent button { transition: transform .45s var(--spring), background-color .2s ease; }
.ib:active, .chip:active, .play:active, .speed:active, .qx:active, .recent button:active { transform: scale(.9); transition: transform .08s ease-out, background-color .1s ease; }
@media (prefers-reduced-motion: reduce) { .ep, .ib, .chip, .play, .speed, .qx, .recent button { transition: none !important; } }
/* hover (mouse only): things you can click grow a touch on a spring; pressing still dips them (rules below win over hover) */
.ov .h button, .lvpick select { transition: transform .45s var(--spring), background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .ep:hover { transform: scale(1.012); }
  .ib:hover, .chip:hover, .qx:hover, .recent button:hover { transform: scale(1.07); }
  #nextep:hover, #again:hover, .speed:hover, .lvpick select:hover, .ov .h button:hover { transform: scale(1.04); }
  .play:hover { transform: scale(1.06); }
  .rng:hover .thumb { transform: scale(1.15); }
}
.ep:active { transform: scale(.975); transition: transform .1s ease-out; }
.ib:active, .chip:active, .play:active, .speed:active, .qx:active, .recent button:active { transform: scale(.9); transition: transform .08s ease-out, background-color .1s ease; }
#nextep:active, #again:active, .speed:active, .lvpick select:active, .ov .h button:active { transform: scale(.95); transition: transform .08s ease-out, background-color .1s ease; }

/* card status: new = green ▶ + length, part-listened = purple "time left", finished = grey ↻ + length */
.ep .st.new { color: var(--jun); }
.ep .st.mid { color: var(--accent); }
.ep .st.done { color: var(--muted); }
.ep .st svg { width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
.ep.isdone .bar i { background: var(--faint); }
.ep .t { grid-column: 1 / -1; font: 700 20px/1.35 var(--f-display); letter-spacing: -.025em; min-width: 0; text-wrap: balance; margin-top: 4px; }

.ep[data-noaudio] .t, .ep[data-noaudio] .b { opacity: .62; }
/* the two top bars (search here, the episode header in the player) share one look: solid page colour, with a hairline once content
   scrolls under. Solid on purpose: iOS Safari tints the status-bar strip from a pinned bar only when its background is opaque;
   anything translucent makes it fall back to a soft blur that smears over the top of the field. */
/* a solid strip fixed behind the status bar: iOS Safari only swaps its soft top-edge blur for a flat colour when an opaque
   element is FIXED at the very top (a sticky bar doesn't count), so this keeps the strip clean in search mode and while scrolling */
/* while search or find is open the bar is swapped from sticky to truly fixed (same spot, the space it leaves is padded back), because
   iOS 26 only skips its top-edge blur for a solid FIXED bar on the edge; a sticky bar that isn't stuck yet (top of the page) doesn't count */
.search.pinned { position: fixed; top: 0; left: 0; right: 0; margin: 0; z-index: 3; padding-inline: max(16px, calc((100% - 664px) / 2)); }
.top.pinned { position: fixed; top: 0; left: 0; right: 0; }
.top.pinned > .wrap { padding-left: calc(max(var(--edge), env(safe-area-inset-left, 0px)) + 8px); padding-right: calc(max(var(--edge), env(safe-area-inset-right, 0px)) + 8px); }
/* iOS 26 picks the top-edge style (solid colour vs blur) once, at page load, before the first touch: it hit-tests 4px below the top edge and
   only a full-width fixed/sticky opaque box there gives a solid edge. This strip is that box, so it must be taller than 4px even when the safe area is 0.
   z-index 1 keeps it under the search bar (2/3) and the episode bar (3) so it never clips them */
.sbar { position: fixed; top: 0; left: 0; right: 0; height: max(8px, env(safe-area-inset-top, 0px)); background: var(--bg); z-index: 1; pointer-events: none; }
.search, .top { background: var(--bg);
  border-bottom: 1px solid transparent; transition: border-color .2s ease; }
.search.stuck, .top.stuck { border-bottom-color: var(--rule); }
.search { position: sticky; top: 0; z-index: 2; padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 12px;
  margin-inline: calc(-1 * var(--edge)); padding-inline: var(--edge); }
.srow { display: flex; align-items: center; }
.srow .wrapin { flex: 1; min-width: 0; }

/* ---------- player ---------- */
#player { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 3; }
.top { transition: transform .28s cubic-bezier(.22,1,.36,1), border-color .2s ease, padding-top .26s cubic-bezier(.22,1,.36,1); }
/* while the keyboard is up iOS draws a soft blur band just under the status bar; give the bar a little extra room at the
   top so the field sits below it, and ease back when the keyboard goes */
.search { transition: border-color .2s ease, padding-top .26s cubic-bezier(.22,1,.36,1); }

.top.away { transform: translateY(-105%); }
.top .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }

/* find in this episode: the header turns into a find bar (like Safari's Find on Page) */

/* header icons: grey wash on press; the book stays "on" (darker, washed) while its list or one of its cards is open */

#findbtn { margin-right: -4px; }
/* The find bar lies over the title row (same height, so nothing jumps). Opening morphs the search icon into the
   field: the pill stretches out of the icon on a spring (a small overshoot, then it settles) with the magnifier riding
   its left edge; the arrows and Done pop in after it on the same spring. Closing folds the pill back into the icon.
   The motion itself runs from JS (morphFind) so it can start from the icon's real position. */
.top .wrap { position: relative; }
.top .ttl { transition: opacity .2s ease .12s, transform .4s cubic-bezier(.22,1,.36,1) .08s; }
#back, #xpbtn { transition: opacity .2s ease .12s, transform .45s var(--spring), background-color .2s ease, color .2s ease; }
#back:active, #xpbtn:active, #findbtn:active { transform: scale(.88); transition: transform .08s ease-out, background-color .08s ease, color .08s ease; }
.top.finding .ttl, .top.finding #back, .top.finding #xpbtn { transition: opacity .16s ease, transform .4s cubic-bezier(.22,1,.36,1); }
#findbtn { transition: opacity .12s ease .19s; }
.top.finding .ttl, .top.finding #back, .top.finding #xpbtn, .top.finding #findbtn { opacity: 0; pointer-events: none; }
.top.finding #findbtn { transition: opacity 0s; }
.top.finding .ttl { transform: translateX(-10px); }
.findbar { position: absolute; inset: 0; padding: inherit; display: flex; align-items: center; gap: 0; min-width: 0;
  visibility: hidden; pointer-events: none; transition: visibility 0s linear .27s; }
.top.finding .findbar { visibility: visible; pointer-events: auto; transition: visibility 0s; }
.findbar .fbg { position: absolute; inset: 0; border-radius: 999px; background: var(--field); }
.findbar .fbg { transition: box-shadow .12s ease; }
.top.finding .fwrap:focus-within .fbg { box-shadow: 0 0 0 2px var(--accent); transition: box-shadow .2s ease .24s; }
#fq, #fcount { opacity: 0; transition: opacity .06s ease; }
.top.finding #fq, .top.finding #fcount { opacity: 1; transition: opacity .16s ease .17s; }   /* once the pill is under the text */
.findbar > .ib, .fdone { opacity: 0; transform: scale(.4); transition: opacity .1s ease, transform .2s ease; }
.top.finding .findbar > .ib, .top.finding .fdone { opacity: 1; transform: none;
  transition: opacity .14s ease var(--d, .06s), transform .4s var(--spring) var(--d, .06s); }
#fprev { --d: .06s; } #fnext { --d: .09s; } .fdone { --d: .12s; transform-origin: 30% 50%; }
@media (prefers-reduced-motion: reduce) { .findbar, .top.finding .findbar, .top .ttl, #findbtn, .findbar > .ib, .fdone, #fq, #fcount { transition: none !important; } }
/* while typing a search the player bar steps aside, so the keyboard and the script share the screen */
.transport { transition: transform .3s cubic-bezier(.22,1,.36,1); }
body.findtype .transport { transform: translateY(110%); }
.findbar .fwrap { flex: 1; position: relative; min-width: 0; }
.findbar input { position: relative; width: 100%; height: 40px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); padding: 0 62px 0 38px;
  font: 16px var(--f-body); -webkit-appearance: none; appearance: none; }
.findbar input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.findbar input:focus { outline: none; }
.findbar .fwrap svg { position: absolute; left: 12px; top: 11px; width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
#fcount { position: absolute; right: 14px; top: 0; font: 500 12px/40px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
.findbar .ib { width: 34px; height: 36px; color: var(--ink); }
#fprev { margin-left: 6px; }          /* field→up gap = up→down gap (12px between the drawn arrows either way) */
.findbar .ib:disabled { color: var(--faint); }
.fdone { font: 500 15.5px var(--f-latin); color: var(--accent); padding: 8px 2px 8px 8px; white-space: nowrap; }
.line { position: relative; }
.line > .ko, .line > .en, .line > .who { position: relative; z-index: 1; }
.fh { position: absolute; z-index: 0; border-radius: 2px; background: color-mix(in srgb, #ffd23f 42%, transparent); pointer-events: none; }

.top .ttl b { display: block; font: 700 17px/1.3 var(--f-display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ib { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }

.script { flex: 1; padding-block: 10px 196px; }

.sec { font: 600 11px var(--f-mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; margin: 26px 4px 8px; display: flex; gap: 10px; align-items: center; }
.sec::after { content: ""; height: 1px; flex: 1; background: var(--rule); }
.line { display: grid; grid-template-columns: 2.9rem 1fr; gap: 9px; padding: 12px 10px; border-radius: 14px; cursor: pointer;
  transition: background .25s, box-shadow .25s, opacity .25s; }
.line .who { font: 600 11.5px/24px var(--f-body); text-align: center; height: 24px; margin-top: calc((18.5px * var(--ks, 1) * 1.52 - 24px) / 2); border-radius: 999px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; padding: 0 4px; letter-spacing: -.02em; }
.line .who.mid { font-size: 10.5px; letter-spacing: -.04em; padding: 0 2px; }
.line .who.long { font-size: 9px; letter-spacing: -.06em; padding: 0 1px; }
.line[data-p="Jun"] .who { color: var(--jun); background: var(--jun-soft); }
.line[data-p="Sua"] .who { color: var(--sua); background: var(--sua-soft); }
/* chip colours: the two hosts have their own; every character keeps one colour across episodes (assigned in build_player.py) */
.line[data-r="h0"] .who { color: var(--h0); background: var(--h0-s); }
.line[data-r="h1"] .who { color: var(--h1); background: var(--h1-s); }
.line[data-r="c0"] .who { color: var(--c0); background: var(--c0-s); }
.line[data-r="c1"] .who { color: var(--c1); background: var(--c1-s); }
.line[data-r="c2"] .who { color: var(--c2); background: var(--c2-s); }
.line[data-r="c3"] .who { color: var(--c3); background: var(--c3-s); }
.line[data-r="c4"] .who { color: var(--c4); background: var(--c4-s); }
.line[data-r="c5"] .who { color: var(--c5); background: var(--c5-s); }
.line[data-r="c6"] .who { color: var(--c6); background: var(--c6-s); }
.line[data-r="c7"] .who { color: var(--c7); background: var(--c7-s); }
.line[data-r="c8"] .who { color: var(--c8); background: var(--c8-s); }
.line .ko { font-size: calc(18.5px * var(--ks, 1)); font-weight: 500; line-height: 1.52; min-width: 0; letter-spacing: -.01em; }
.ko .nb { white-space: nowrap; }
.line .en { grid-column: 2; color: var(--muted); font-family: var(--f-latin); font-size: calc(14.5px * var(--ks, 1)); line-height: 1.45; margin-top: 1px; }
/* in translations: Korean left as Korean (names, quoted words) is set apart; romanised Korean terms are italic */
.hg { font-family: "Noto Sans KR", sans-serif; font-weight: 600; color: var(--ink); opacity: .78; font-size: .96em; }
.rk { font-style: italic; }
/* Chinese and Japanese wrap between any two characters; keep-all (for Korean) would only break them at punctuation */
:is([data-ui^="z"], [data-ui="ja"]) :is(.en, .ov p, .ov dd, .ep .te, .ep .b, .hit .e, .banner, .dt .use .e, .dt .mean, .dt .ex .e, .dt ul, .xp span, .lede, .top .ttl > i, .sheet p.h) { word-break: normal; }
:is([data-ui^="z"], [data-ui="ja"]) .hg { word-break: keep-all; }
.line mark.v, .xp.v b, .dt.v .use mark { text-decoration: none; -webkit-text-decoration: none; border-radius: 0;
  /* dots spaced evenly along the whole word, first and last flush with its ends (repeat: space). Where two highlighted
     words touch with no space between (.gr on the left one, .gl on the right one, set in markAdj), the dots stop 4px short
     on the touching side, anchored there, so the two read as two. Nothing opaque is painted, so the dots can sit over a
     grammar box in the row below without notching it */
  background: radial-gradient(circle at 2px 1px, var(--accent) 1px, transparent 1.3px) 0 100% / 4px 2px space no-repeat;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 0 3px; }
.line mark.v { font-weight: 600; }
.line .ko mark.v { position: relative; z-index: 1; }
.line mark.v.gr { background: var(--dotsR) 0 100% / calc(100% - 4px) 2px no-repeat; }
.line mark.v.gl { background: var(--dotsL) 4px 100% / calc(100% - 4px) 2px no-repeat; }
.line mark.v.gl.gr { background: var(--dotsL) 4px 100% / calc(100% - 8px) 2px no-repeat; }   /* the dotted line paints over a grammar box in the next row where they touch */
.line mark { cursor: pointer; background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 700; }
.line.past .ko, .script.live .line:not(.now) .ko { color: var(--muted); }
.line.now { background: var(--now); box-shadow: var(--now-shadow); }
.line.now .ko { color: var(--ink); }
/* word-by-word: in the playing line, words not yet spoken are dim and fill with ink as they are said (left to right).
   Purple expression marks keep their tint; their text fills the same way. */
.line.now.kara .ko .w { color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(90deg, var(--ink) 0 var(--p, 0%), var(--dim) var(--p, 0%) 100%); }
.line.now.kara .ko .w.on { --p: 100%; }
.line mark.ml { border-top-left-radius: 0; border-bottom-left-radius: 0; padding-left: 0; }
.line mark.mr { border-top-right-radius: 0; border-bottom-right-radius: 0; padding-right: 0; }
.line.now.kara .ko mark { color: inherit; }
.line:active { background: var(--accent-soft); }
.line.notime { cursor: default; }
.line.notime .ko { color: var(--muted); }
.line.flash { box-shadow: 0 0 0 2px var(--accent) inset; }
.banner { font-family: var(--f-latin); margin: 12px 4px 0; padding: 11px 13px 11px 11px; border-radius: 12px; background: var(--warn-bg); color: var(--warn);
  border: 1px solid var(--warn-line); font-size: 13.5px; line-height: 1.5; display: grid; grid-template-columns: 20px 1fr; gap: 9px; align-items: start; }
.banner .bi { width: 20px; height: 20px; border-radius: 50%; background: var(--warn-dot); color: #2b2100; display: grid; place-items: center;
  font: 800 13px/1 var(--f-latin); margin-top: 0; }
.transport.off .seek, .transport.off .mid, .transport.off #speed, .transport.off #again { opacity: .4; pointer-events: none; }
#eptitle_en { display: none !important; }   /* too long to fit; the title is in the overview card anyway */
.top .ttl > i { display: block; font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note { margin: 18px 4px 0; color: var(--muted); font-size: 13px; }

.transport { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border: 1px solid var(--rule); border-bottom: 0;
  border-radius: 22px 22px 0 0; box-shadow: 0 -8px 28px rgba(10,10,20,.07); padding-bottom: env(safe-area-inset-bottom, 0px); }
.transport .wrap { padding-block: 18px 14px; padding-inline: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 17px; }
.seek { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font: 500 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.nowpl { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: 600 13.5px var(--f-body); color: var(--ink); margin-bottom: -6px; }
.nowpl b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.nowpl .nowtag { flex: none; font: 600 11px/1 var(--f-mono); letter-spacing: .02em; color: var(--accent); background: var(--accent-soft); padding: 6px 7px 4px; border-radius: 6px; }   /* the mono caps ride high: 1px more on top centres them */
.nowpl svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.nowpl .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; flex: none; }
.nowpl .eq i { width: 3px; border-radius: 2px; background: var(--accent); height: 40%; animation: eq 1s ease-in-out infinite alternate; }
.nowpl .eq i:nth-child(2) { animation-delay: -.35s; } .nowpl .eq i:nth-child(3) { animation-delay: -.7s; }
.paused .nowpl .eq i { animation-play-state: paused; }
@keyframes eq { from { height: 30%; } to { height: 100%; } }
body.mini #list { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 200px); }
/* seek bar drawn by hand: a soft track instead of the browser's dark outline in dark mode */
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 24px; margin: 0; width: 100%; --track: color-mix(in srgb, var(--ink) 13%, transparent); }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) 0 var(--fill, 0%), var(--track) var(--fill, 0%) 100%); }
.rng input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--accent) 0 calc(14px + (100% - 28px) * var(--f, 0)), var(--track) calc(14px + (100% - 28px) * var(--f, 0)) 100%); }
.rng input[type=range]::-webkit-slider-thumb { width: 28px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.08); }
.rng { position: relative; display: block; }
.rng input[type=range] { display: block; }          /* inline, it sat on the text baseline: .rng grew to 27px and the pill drew 1.5px below the track */
#cur { transition: color .2s ease; }
#cur.scrub { color: var(--accent); font-weight: 600; }
.rng input[type=range]::-webkit-slider-thumb { opacity: 0; }
.rng input[type=range]::-moz-range-thumb { opacity: 0; }
.rng .thumb { position: absolute; top: 50%; left: calc(14px + (100% - 28px) * var(--f, 0)); width: 28px; height: 18px; margin: -9px 0 0 -14px; border-radius: 999px;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.08); pointer-events: none;
  transition: transform .5s cubic-bezier(.34,1.9,.5,1), box-shadow .3s ease; }
.rng.held .thumb { transform: scale(1.4); transition: transform .42s cubic-bezier(.3,2.2,.45,1), box-shadow .25s ease;
  /* held: a thin soft accent ring plus the same faint accent glow as the dark-mode play button, so both read as one family */
  box-shadow: 0 1px 4px rgba(0,0,0,.28), 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent), 0 2px 14px color-mix(in srgb, var(--accent) 22%, transparent); }
@media (prefers-reduced-motion: reduce) { .rng .thumb { transition: none; } }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ctrls .side { display: flex; align-items: center; gap: 6px; flex: 1; }
.ctrls .side.right { justify-content: flex-end; }
.ctrls .side.right { gap: 2px; }
#nextep[disabled] { opacity: .3; }
.ctrls .tx { display: none; }
/* end-of-episode coach mark: a speech bubble over the next-episode button, tail centred underneath, gently bobbing */
.coach { position: fixed; z-index: 5; left: 0; bottom: 0; transform: translate(-50%, 0); padding: 9px 14px; border-radius: 14px; white-space: nowrap;
  background: var(--bubble); color: var(--ink); border: 1px solid var(--bubble-line); font: 600 14px/1.2 var(--f-latin);
  box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.14);
  opacity: 0; scale: .8; transform-origin: 50% 100%; transition: opacity .2s ease, scale .45s var(--spring); }
.coach::after { content: ""; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: inherit;
  border: solid var(--bubble-line); border-width: 0 1px 1px 0; border-radius: 0 0 3px 0; transform: rotate(45deg); }
.coach b { color: var(--accent); font-weight: 700; }
/* the bubble: a neutral card one step up from the player bar (white in light mode, a lighter grey in dark) */
:root { --bubble: #ffffff; --bubble-line: #e3e4ec; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bubble: #2b2c37; --bubble-line: #393b48; } }
:root[data-theme="dark"] { --bubble: #2b2c37; --bubble-line: #393b48; }

/* Sheets (17 Oct, smoother): the dim is a composited ::before fading its opacity (was a full-screen background-color
   transition, repainted every frame); the panel slides on its own GPU layer (translate3d, contain) with the iOS sheet
   curve over .44s (was .58s with a long tail); the continuous-corner mask is no longer on the moving panel. */

.sheet::before { content: ""; position: absolute; inset: 0; background: rgba(10,10,20,.35); opacity: 0; transition: opacity .3s ease; will-change: opacity; }
.sheet.open::before { opacity: 1; }
.sheet.closing { pointer-events: none; }
.sheet.closing::before { transition-duration: .22s; }
.sheet .panel { position: relative; z-index: 1; transform: translate3d(0, 100%, 0); transition: transform .44s var(--sheet-ease), opacity .24s ease, height .34s var(--spring-sheet);
  will-change: transform; backface-visibility: hidden; contain: layout paint; }
.sheet.open .panel { transform: translate3d(0, 0, 0); }
.sheet.closing .panel { transition: transform .24s cubic-bezier(.4,0,1,1), opacity .2s ease; }
/* list ⇄ card: the dimmed backdrop stays put and the panels slide sideways */
.sheet.swap::before { transition: none; opacity: 1; }
.sheet.swap .panel { transform: translate3d(var(--dx, 28px), 0, 0); opacity: 0; transition: transform .42s var(--spring), opacity .2s ease, height .34s var(--spring-sheet); }
.sheet.swap.open::before { opacity: 1; }
.sheet.swap.open .panel { transform: translate3d(0, 0, 0); opacity: 1; }
.sheet.swap.closing::before { opacity: 0; transition: opacity .22s ease; }
.sheet.swap.closing .panel { transform: translate3d(calc(var(--dx, 28px) * -1), 0, 0); opacity: 0; transition: transform .26s ease, opacity .18s ease; }

/* desktop: moving between the grammar list and a card keeps the panel fixed and slides only its content, page to page

.sheet.slide-in { z-index: 8; }

.dt ul li::before { content: ""; position: absolute; left: 2px; top: calc(.775em - 2px); width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
.dt .uses { display: grid; gap: 10px; padding-bottom: 8px; }
.dt .use { display: grid; gap: 3px; text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px;
  background: color-mix(in srgb, var(--ink) 4.5%, var(--surface)); transition: transform .45s var(--spring), background-color .15s ease; }
@media (hover: hover) and (pointer: fine) { .dt .use:hover { background: color-mix(in srgb, var(--ink) 7.5%, var(--surface)); } }
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) { .dt .use:hover { transform: scale(1.012); } }
.dt .use:active { background: color-mix(in srgb, var(--ink) 9%, var(--surface)); transform: scale(.98); transition: transform .08s ease-out, background-color .08s ease; }
.dt .use .k { font-size: 16px; font-weight: 500; line-height: 1.6; }
.dt .use .e { font-family: var(--f-latin); font-size: 13.5px; color: var(--muted); }
.dt .use mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 700; }

.dt .use .go { font: 500 11px var(--f-mono); color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .line { transition: none; } }
/* hover tooltips (mouse only; phones never see them): the button's label, plus its key, after a short pause */
@media (hover: hover) and (pointer: fine) {
  [data-tip] { position: relative; }
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; z-index: 30; left: 50%; top: calc(100% + 8px); translate: -50% 0;
    white-space: nowrap; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: var(--ink); color: var(--bg);
    font: 500 12px/1.2 var(--f-latin); letter-spacing: 0; opacity: 0; animation: tipin .14s ease .5s forwards; }
  [data-tip][data-tip-up]:hover::after { top: auto; bottom: calc(100% + 8px); }
  [data-tip][data-tip-end]:hover::after { left: auto; right: 0; translate: 0 0; }
  [data-tip][data-tip-start]:hover::after { left: 0; translate: 0 0; }
  @keyframes tipin { from { opacity: 0; } to { opacity: 1; } }
}
.sidefoot { display: none; }
.alert.kb .abox { max-width: 340px; text-align: left; }
.alert.kb h2 { text-align: center; margin-bottom: 14px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; margin: 0 0 20px; font: 400 14px/1.35 var(--f-latin); color: var(--ink); }
.keys dt { display: flex; gap: 4px; justify-content: flex-end; }
.keys dd { margin: 0; color: var(--muted); }
.keys kbd { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px; display: inline-grid; place-items: center; font: 600 12px var(--f-mono);
  background: color-mix(in srgb, var(--ink) 7%, var(--surface)); border: 1px solid var(--rule); border-bottom-width: 2px; color: var(--ink); }
.alert .abtns.one { grid-template-columns: 1fr; }

/* ---------- Desktop (17 Oct): two panels from 1024px. Phones and narrow windows are unchanged.
   Left: the episode list (its own scroll), always visible, current episode marked. Right: the episode (the window scrolls it).
   Grammar/vocab cards float in from the right, rounded on all corners, over a scrim that blocks the page and pauses audio. */
@media (min-width: 1024px) {
  :root { --side: 340px; }
  #list, #list[hidden] { display: block !important; position: fixed; top: 0; bottom: 0; left: 0; width: var(--side); max-width: none; margin: 0;
    overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 32px; border-right: 1px solid var(--rule); background: var(--bg); z-index: 4;
    box-sizing: border-box; }
  body.searching #list { padding-top: 0; }
  /* the list's top space sits on its header, so the sticky search bar meets the very top edge (cards no longer show above it);
     the bar spans the sidebar's full width so its divider runs edge to edge */
  #list > .hdr { padding-top: 28px; }
  #list .logo { width: 52px; height: 52px; margin-left: -2px; }
  #list .mast { gap: 10px; }
  #list .mast h1 { font-size: 26px; }
  #list .search.pinned, #list .search { position: sticky; left: auto; right: auto; margin-inline: -14px; padding-inline: 14px; }
  /* (episode cards keep the phone layout: summary shown, same padding) */
  /* current episode: a soft accent tint and a hairline accent stroke (same 1px weight as the other cards), EP number in accent */
  #list .ep.cur, #list .ep.cur:hover { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  #list .ep.cur .no { color: var(--accent); }
  #list .ep:hover, #list .ep:hover::after { background-color: color-mix(in srgb, var(--ink) 3%, var(--surface)); }
  @supports (-webkit-mask-box-image: none) {
    #list .ep.cur { background: transparent; border-color: transparent; }
    #list .ep.cur::before { background: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
    #list .ep.cur::after, #list .ep.cur:hover::after { background-color: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
    #list .ep:hover { background-color: transparent; }
  }
  #player { margin-left: var(--side); }
  .top.pinned { position: sticky; left: auto; right: auto; }
  #back { display: none; }
  /* keyboard shortcuts: a small, quiet round button pinned to the bottom-right corner (the ? key opens the same sheet) */
  .sidefoot { display: block; position: fixed; right: 16px; bottom: 16px; z-index: 5; margin: 0; padding: 0; }
  .sidefoot .ib { width: 34px; height: 34px; border-radius: 50%; color: var(--muted); background: var(--surface); border: 1px solid var(--rule);
    opacity: .7; transition: opacity .15s ease, transform .45s var(--spring); }
  .sidefoot .ib:hover, .sidefoot .ib:focus-visible { opacity: 1; color: var(--ink); }
  .sidefoot .ib svg { width: 17px; height: 17px; }
  /* the player bar floats inside the script column: rounded all round, lifted off the bottom, never over the list */
  .transport { left: calc(var(--side) + 64px); right: 64px; bottom: 16px; max-width: 840px; margin-inline: auto;
    border-radius: 22px; border: 1px solid var(--rule); background: var(--surface); padding-bottom: 0;
    /* full 1px stroke like the cards (the squircle block had made three sides transparent) + a soft lift */
    box-shadow: var(--float-shadow); filter: none; }
  /* inside the bar: use its full width (the phone .wrap caps at 680px and centred the controls with wide empty sides) */
  .transport .wrap { max-width: none; padding-inline: 22px; }
  /* desktop: the bar always says what's playing, like the phone's mini player (a click scrolls back to the current line) */
  .transport .nowpl[hidden] { display: flex !important; }
  .transport .nowpl > svg { display: none; }
  /* room to spare on desktop: the side buttons get text labels */
  .ctrls .tx { display: inline; font: 600 13px var(--f-latin); white-space: nowrap; }
  .speed { display: inline-flex; align-items: center; gap: 7px; padding-inline: 12px; }
  .speed .tx { order: -1; color: var(--muted); font-weight: 500; }
  #nextep, #again { width: auto; height: 36px; padding: 0 12px 0 9px; border-radius: 10px; grid-auto-flow: column; gap: 7px; color: var(--ink); }
  #nextep svg, #again svg { width: 19px; height: 19px; }
  #nextep:hover:not([disabled]), #again:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .ctrls .side.right { gap: 4px; }
  /* three columns so play stays dead centre whatever the label lengths; when the bar is narrow the right-hand labels drop */
  .ctrls { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  .transport.fitr #nextep .tx, .transport.fitr #again .tx, .transport.fitl .speed .tx { display: none; }
  .transport.fitr #nextep, .transport.fitr #again { width: 40px; padding: 0; }
  .transport { container-type: inline-size; }
  @container (max-width: 760px) { #nextep .tx, #again .tx { display: none; } #nextep, #again { width: 40px; padding: 0; } }
  .transport::before, .transport::after { display: none; }
  .back-now { bottom: calc(var(--tp, 140px) + 40px); }
  .speedmenu { bottom: calc(var(--tp, 140px) + 26px); }
  #script { padding-bottom: calc(var(--tp, 140px) + 48px); }
  .sbar { left: var(--side); }
  .back-now { left: calc(50% + var(--side) / 2); }
  .speedmenu, .langmenu { left: max(calc(var(--side) + 16px), calc(var(--side) + (100% - var(--side) - 664px) / 2)); }
  .line { cursor: pointer; }
  .line:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); border-radius: 12px; }
  .sheet { align-items: stretch; justify-content: flex-end; }
  .sheet .panel { width: 440px; max-width: calc(100% - 32px); max-height: none; margin: 16px; border-radius: 22px; padding-bottom: 18px;
    transform: translate3d(calc(100% + 32px), 0, 0); box-shadow: 0 12px 48px rgba(10,10,20,.22); }
  .sheet.open .panel, .sheet.swap.open .panel { transform: translate3d(0, 0, 0); }
}
/* ---------- Wide screens (17 Oct): from 1600px a third panel on the right holds the episode's grammar & vocab list, and a
   word's card opens there in place of the list (back returns to the list). No scrim and audio keeps playing. */
@media (min-width: 1600px) {
  :root { --rail: 420px; }
  html { zoom: .94; }   /* text and controls read a little large at this size; breakpoints still follow the real window width */
  #player { margin-right: var(--rail); }
  .transport { right: calc(var(--rail) + 64px); }
  .sidefoot { right: calc(var(--rail) + 16px); }
  .back-now { left: calc(var(--side) + (100% - var(--side) - var(--rail)) / 2); }
  .speedmenu, .langmenu { left: max(calc(var(--side) + 16px), calc(var(--side) + (100% - var(--side) - var(--rail) - 664px) / 2)); }
  #xpbtn { display: none; }
  .sheet { left: auto; right: 0; width: var(--rail); align-items: stretch; justify-content: stretch; z-index: 3; }
  .sheet::before { display: none; }
  .sheet .panel { width: 100%; max-width: none; margin: 0; border-radius: 0; box-shadow: none; border-left: 1px solid var(--rule);
    transform: translate3d(24px, 0, 0); opacity: 0; transition: transform .36s var(--sheet-ease), opacity .2s ease, height .34s var(--spring-sheet); }
  .sheet.open .panel, .sheet.swap.open .panel { transform: translate3d(0, 0, 0); opacity: 1; }
  .sheet .panel [data-close] { display: none; }
  /* the panel's own collapse button (top right); collapsed, the script and player take the room and the book icon brings it back */
  .sheet .panel .railx { display: grid; margin-right: -8px; color: var(--muted); }
  body.railoff { --rail: 0px; }
  body.railoff .sheet { display: none !important; }
  body.railoff #xpbtn { display: grid; }
}
.railx { display: none; }
</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DESK = matchMedia("(min-width: 1024px)");
  var WIDE = matchMedia("(min-width: 1600px)");      // three panels: the grammar & vocab list stays docked on the right      // two-panel desktop layout (CSS does the layout; JS only adjusts behaviour)
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var fmt = function (s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  var esc = function (t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
