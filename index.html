<style>
/* Korean fonts draw … as three dots at mid-height (···); take just that character from the system's Latin font */
@font-face { font-family: "Dots"; unicode-range: U+2026;
  src: local("Helvetica Neue"), local("HelveticaNeue"), local("SF Pro Text"), local("Roboto"), local("Segoe UI"), local("Arial"); }
/* Layout: a script you read like lyrics. Episode list → one scrolling transcript with a fixed transport bar at the bottom. */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --ink: #17181f; --muted: #646878; --faint: #a3a6b4; --rule: #e1e3ea;
  --accent: #5b4fd6; --accent-soft: #ecebfd; --hl: #e4e1fd;
  --jun: #237a6b; --jun-soft: #e1f2ee; --sua: #b9476e; --sua-soft: #fbe6ee;
  --now: #ffffff; --now-shadow: 0 1px 2px rgba(23,24,31,.06), 0 6px 22px rgba(91,79,214,.12);
  --f-display: "Dots", "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
  --f-body: "Dots", "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --f-latin: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --edge: 8px; --field: color-mix(in srgb, var(--ink) 5.5%, var(--bg));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121318; --surface: #1b1c23; --ink: #eceef5; --muted: #9a9daf; --faint: #5f6273; --rule: #2a2c36;
  --accent: #a59cff; --accent-soft: #2a2747; --hl: #332f5c;
  --jun: #6fcdb9; --jun-soft: #173a33; --sua: #f08fb1; --sua-soft: #43202e;
  --now: #20212b; --now-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.35); --field: #0b0c10; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121318; --surface: #1b1c23; --ink: #eceef5; --muted: #9a9daf; --faint: #5f6273; --rule: #2a2c36;
  --accent: #a59cff; --accent-soft: #2a2747; --hl: #332f5c;
  --jun: #6fcdb9; --jun-soft: #173a33; --sua: #f08fb1; --sua-soft: #43202e;
  --now: #20212b; --now-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.35); --field: #0b0c10; color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
:root { --dim: color-mix(in srgb, var(--ink) 32%, transparent); }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .line:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(var(--edge), env(safe-area-inset-left, 0px)); padding-right: max(var(--edge), env(safe-area-inset-right, 0px)); }
.sheet .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- episode list ---------- */
#list { padding-block: calc(env(safe-area-inset-top, 0px) + 28px) 48px; }
.mast { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding-inline: 8px; }
.mast .tools { margin-left: auto; display: flex; align-items: center; gap: 4px; margin-right: -6px; }
.mast .refresh { color: var(--muted); }
.mast .lang { color: var(--muted); font-family: var(--f-latin); display: inline-flex; align-items: center; gap: 5px; padding: 0 11px 0 9px; }
.mast .lang svg { width: 16px; height: 16px; }
.mast .lang[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.mast .refresh.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.logo { width: 64px; height: 64px; flex: none; overflow: visible; margin-left: -4px; }
.logo .lg { font: 900 150px "Noto Sans KR", sans-serif; fill: #fff; text-anchor: middle; }
.logo .b2f { fill: var(--ink); stroke: var(--bg); stroke-width: 32px; paint-order: stroke; }
.logo .b2 text { fill: var(--bg); }
.logo .b1 { transform-origin: 90px 300px; animation: lgpop 8s infinite cubic-bezier(.3,1.5,.5,1); }
.logo .b2 { transform-origin: 440px 464px; animation: lgpop2 8s infinite cubic-bezier(.3,1.5,.5,1); }
@keyframes lgpop { 0% { transform: scale(0); opacity: 0 } 5% { transform: scale(1); opacity: 1 } 76% { transform: scale(1); opacity: 1 } 82%, 100% { transform: scale(.9); opacity: 0 } }
@keyframes lgpop2 { 0%, 9% { transform: scale(0); opacity: 0 } 14% { transform: scale(1); opacity: 1 } 76% { transform: scale(1); opacity: 1 } 82%, 100% { transform: scale(.9); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .logo .b1, .logo .b2 { animation: none; } }
.mast h1 { font: 800 clamp(24px, 7vw, 32px)/1.15 "Poppins", var(--f-display); margin: 0; letter-spacing: -.025em; white-space: nowrap; }
.mast .count { font: 500 12px var(--f-mono); color: var(--muted); }
.lede { color: var(--muted); font-size: 14px; font-family: var(--f-latin); margin: 0 0 22px; padding-inline: 8px; }
.lvl { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 10px 8px 10px; display: flex; justify-content: space-between; }
.lvl .count { letter-spacing: .02em; text-transform: none; font-weight: 500; }
.eps { display: grid; gap: 10px; }
.ep { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; width: 100%;
  padding: 14px 16px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px;
  box-shadow: 0 1px 2px rgba(23,24,31,.04); transition: transform .15s; }
.ep:active { transform: scale(.985); }
.ep .no { font: 500 11.5px/1.6 var(--f-mono); color: var(--faint); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.ep .st { font: 500 11.5px/1.6 var(--f-mono); letter-spacing: .02em; color: var(--muted); white-space: nowrap; justify-self: end; }
.ep .st.new { color: var(--accent); }
.ep .st.done { color: var(--jun); }
.ep .t { grid-column: 1 / -1; font: 900 20px/1.35 var(--f-display); letter-spacing: -.025em; min-width: 0; text-wrap: balance; margin-top: 4px; }
.ep .te { grid-column: 1 / -1; font-family: var(--f-latin); font-size: 14px; font-weight: 500; color: var(--muted); min-width: 0; }
.ep .b { grid-column: 1 / -1; font-family: var(--f-latin); font-size: 14px; line-height: 1.5; color: var(--ink); opacity: .82; min-width: 0; margin-top: 8px; }
.ep[data-noaudio] .t, .ep[data-noaudio] .b { opacity: .62; }
.search { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 12px;
  margin-inline: calc(-1 * var(--edge)); padding-inline: var(--edge); }
.search::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 18px; pointer-events: none;
  background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 0%, transparent)); }
.search input { width: 100%; height: 44px; border-radius: 999px; border: 1px solid transparent; background: var(--field); color: var(--ink);
  padding: 0 16px 0 44px; font: 16px var(--f-body); -webkit-appearance: none; appearance: none; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.search input::placeholder { color: var(--muted); opacity: .85; }
.search { --icon: var(--faint); }
.search .wrapin { position: relative; }
.search svg { position: absolute; left: 15px; top: 12px; width: 20px; height: 20px; color: var(--faint); pointer-events: none; }
.results { display: grid; gap: 2px; }
.results .meta { font: 500 12px var(--f-mono); color: var(--muted); margin: 4px 4px 8px; }
.hit { display: grid; gap: 2px; text-align: left; width: 100%; padding: 12px 4px; border-bottom: 1px solid var(--rule); }
.hit .where { font: 500 11.5px var(--f-mono); color: var(--faint); letter-spacing: .03em; }
.hit .where b { color: var(--muted); font-weight: 500; }
.hit .k { font-size: 16.5px; line-height: 1.55; }
.hit .e { font-size: 13.5px; color: var(--muted); }
.hit mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; }
.bar { height: 3px; border-radius: 2px; background: var(--rule); grid-column: 1 / -1; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* ---------- player ---------- */
#player { height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 3; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.top .ttl { flex: 1; min-width: 0; }
.top .ttl b { display: block; font: 900 17px/1.3 var(--f-display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .ttl small { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.ib { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.ib:active { background: var(--accent-soft); }
.ib svg { width: 22px; height: 22px; }
.chip { height: 32px; padding: 0 11px; border-radius: 999px; font: 600 12.5px var(--f-body); border: 1px solid var(--rule); flex: none; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.xpc { display: inline-flex; align-items: center; gap: 5px; padding: 0 9px 0 12px; font: 600 13px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.chip.xpc svg { width: 17px; height: 17px; }

.script { flex: 1; padding-block: 10px 196px; }
.sec { font: 600 11px var(--f-mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; margin: 26px 4px 8px; display: flex; gap: 10px; align-items: center; }
.sec::after { content: ""; height: 1px; flex: 1; background: var(--rule); }
.line { display: grid; grid-template-columns: 2.9rem 1fr; gap: 9px; padding: 12px 10px; border-radius: 14px; cursor: pointer;
  transition: background .25s, box-shadow .25s, opacity .25s; }
.line .who { font: 600 11.5px/24px var(--f-body); text-align: center; height: 24px; margin-top: calc((18.5px * var(--ks, 1) * 1.52 - 24px) / 2); border-radius: 999px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; padding: 0 4px; letter-spacing: -.02em; }
.line .who.mid { font-size: 10.5px; letter-spacing: -.04em; padding: 0 2px; }
.line .who.long { font-size: 9px; letter-spacing: -.06em; padding: 0 1px; }
.line[data-p="Jun"] .who { color: var(--jun); background: var(--jun-soft); }
.line[data-p="Sua"] .who { color: var(--sua); background: var(--sua-soft); }
.line .ko { font-size: calc(18.5px * var(--ks, 1)); font-weight: 500; line-height: 1.52; min-width: 0; letter-spacing: -.01em; }
.line .en { grid-column: 2; color: var(--muted); font-family: var(--f-latin); font-size: calc(14.5px * var(--ks, 1)); line-height: 1.45; margin-top: 1px; }
/* in translations: Korean left as Korean (names, quoted words) is set apart; romanised Korean terms are italic */
.hg { font-family: "Noto Sans KR", sans-serif; font-weight: 600; color: var(--ink); opacity: .78; font-size: .96em; }
.rk { font-style: italic; }
/* Chinese wraps between any two characters; keep-all (for Korean) would only break it at punctuation */
[data-ui^="z"] .en, [data-ui^="z"] .ov p, [data-ui^="z"] .ov dd, [data-ui^="z"] .ep .te, [data-ui^="z"] .ep .b, [data-ui^="z"] .hit .e,
[data-ui^="z"] .banner, [data-ui^="z"] .dt .use .e, [data-ui^="z"] .lede, [data-ui^="z"] .top .ttl i, [data-ui^="z"] .sheet p.h { word-break: normal; }
[data-ui^="z"] .hg { word-break: keep-all; }
.line mark.v { background: none; padding: 0; font-weight: 600; text-decoration: underline dotted var(--accent);
  text-decoration-thickness: 2px; text-underline-offset: 5px; -webkit-text-decoration: underline dotted var(--accent); }
.line mark { cursor: pointer; background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 700; }
.line.past .ko, .script.live .line:not(.now) .ko { color: var(--muted); }
.line.now { background: var(--now); box-shadow: var(--now-shadow); }
.line.now .ko { color: var(--ink); }
/* word-by-word: in the playing line, words not yet spoken are dim and fill with ink as they are said (left to right).
   Purple expression marks keep their tint; their text fills the same way. */
.line.now.kara .ko .w { color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(90deg, var(--ink) 0 var(--p, 0%), var(--dim) var(--p, 0%) 100%); }
.line.now.kara .ko .w.on { --p: 100%; }
.line.now.kara .ko mark { color: inherit; }
.line:active { background: var(--accent-soft); }
.line.notime { cursor: default; }
.line.notime .ko { color: var(--muted); }
.line.flash { box-shadow: 0 0 0 2px var(--accent) inset; }
.banner { font-family: var(--f-latin); margin: 12px 4px 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 13.5px; }
.transport.off .seek, .transport.off .mid, .transport.off #speed, .transport.off #again { opacity: .4; pointer-events: none; }
.top .ttl i { display: block; font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note { margin: 18px 4px 0; color: var(--muted); font-size: 13px; }

.transport { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border: 1px solid var(--rule); border-bottom: 0;
  border-radius: 22px 22px 0 0; box-shadow: 0 -8px 28px rgba(10,10,20,.07); padding-bottom: env(safe-area-inset-bottom, 0px); }
.transport .wrap { padding-block: 22px 12px; padding-inline: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.seek { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font: 500 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 24px; margin: 0; }
.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ctrls .mid { display: flex; align-items: center; gap: 4px; }
.ctrls .side { display: flex; align-items: center; gap: 6px; flex: 1; }
.ctrls .side.right { justify-content: flex-end; }
.chip.en { height: 36px; border-radius: 10px; min-width: 44px; display: inline-grid; place-items: center; }
.chip.en svg { width: 19px; height: 19px; }
.mast .lang:has(#langcode[hidden]) { padding: 0 9px; }
.play { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--surface); display: grid; place-items: center; }
.play svg { width: 26px; height: 26px; }
.speed { font: 600 13px var(--f-mono); min-width: 56px; height: 36px; border-radius: 10px; border: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.speedmenu { position: fixed; z-index: 7; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); left: max(16px, calc(50% - 340px));
  background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 6px; display: grid; gap: 2px; min-width: 120px;
  box-shadow: 0 10px 30px rgba(10,10,20,.18); }
.speedmenu button { height: 44px; border-radius: 10px; font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; text-align: left; padding: 0 14px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.speedmenu button:active { background: var(--accent-soft); }
.speedmenu button[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); }
.speedmenu button small { font: 500 11px var(--f-body); color: var(--muted); }
.langmenu { left: max(16px, calc(50% - 340px)); min-width: 210px; }
.langmenu .lbl { font: 600 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 8px 14px 4px; }
.langmenu button { font: 600 15px var(--f-body); }
.langmenu .sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 2px 4px 4px; }
.langmenu .sizes button { justify-content: center; padding: 0; font-weight: 700; }
.back-now { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(154px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 15px 8px 11px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.back-now svg { width: 16px; height: 16px; flex: none; animation: nudge 1.6s ease-in-out infinite; }
.back-now.up svg { transform: rotate(180deg); animation-name: nudgeup; }
@keyframes nudge { 0%, 55%, 100% { transform: translateY(0) } 25% { transform: translateY(2.5px) } }
@keyframes nudgeup { 0%, 55%, 100% { transform: rotate(180deg) translateY(0) } 25% { transform: rotate(180deg) translateY(2.5px) } }
@media (prefers-reduced-motion: reduce) { .back-now svg { animation: none; } }

/* expressions sheet */
.sheet { position: fixed; inset: 0; z-index: 6; display: flex; align-items: flex-end; background: rgba(10,10,20,.35); }
.sheet .panel { background: var(--surface); width: 100%; max-height: 78%; overflow: auto; border-radius: 20px 20px 0 0;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet .panel .wrap { padding-block: 18px 6px; }
.sheet h2 { font: 800 20px var(--f-display); letter-spacing: -.02em; margin: 0 0 4px; }
.sh-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sh-top .ib { margin-right: -8px; }
.sheet p.h { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.xpsec { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 6px; }
.xpsec h3 { font: 800 15px var(--f-display); margin: 0; letter-spacing: -.01em; }
.xpsec span { font: 500 11.5px var(--f-mono); color: var(--faint); }
.xp { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 2px; border-top: 1px solid var(--rule); text-align: left; width: 100%; }
.xp .tag { justify-self: start; font: 600 10.5px/1 var(--f-mono); letter-spacing: .02em; color: var(--accent); background: var(--accent-soft);
  padding: 4px 7px; border-radius: 6px; }
.xp .tag.v { background: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.xp b { font-weight: 700; font-size: 16.5px; line-height: 1.45; justify-self: start; }
.xp.g b { background: var(--hl); border-radius: 5px; padding: 0 5px; }
.xp.v b { text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.xp span { color: var(--muted); font-size: 13.5px; grid-column: 1; }
.xp em { grid-row: 1 / 4; grid-column: 2; align-self: center; font: 600 11.5px var(--f-mono); color: var(--accent); font-style: normal; white-space: nowrap; }
.xp em.none { color: var(--faint); font-weight: 500; }
/* episode overview */
.ov { margin: 14px 0 4px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--rule); }
.ov .h { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 28px; }
.ov .h span { font: 600 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.ov .h button { font: 600 13px/1 var(--f-latin); color: var(--accent); padding: 8px 2px; }
.ov p { margin: 8px 0 0; font-family: var(--f-latin); font-size: 15px; line-height: 1.55; }
.ov:not(.open) p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ov dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0 0; font-size: 14px; }
.ov:not(.open) dl { display: none; }
.ov dt { max-width: 9.5em; font: 600 10.5px/1.6 var(--f-mono); padding-top: 4px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
.ov dd { margin: 0; line-height: 1.55; font-family: var(--f-latin); }
.ov dd button { color: var(--accent); font-weight: 600; }

  margin: -18px 0 0; padding: 12px 0 6px; }
.dt-top .ib { margin-right: -8px; }
.dt-back { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px 0 0; margin-left: -6px; font: 600 14.5px var(--f-latin); color: var(--accent); }
.dt-back svg { width: 22px; height: 22px; }
.dt-kind { display: inline-block; margin-top: 4px; font: 600 11px/1 var(--f-mono); letter-spacing: .02em; color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 6px; }
.dt h2 { font: 900 26px/1.3 var(--f-display); letter-spacing: -.02em; margin: 4px 0 2px; }
.dt .mean { font-family: var(--f-latin); font-size: 16px; margin: 0 0 14px; }
.dt h3 { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; }
.dt .ex { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.dt .ex .k { font-size: 17px; font-weight: 500; line-height: 1.6; }
.dt .ex .e { font-size: 14px; color: var(--muted); margin-top: 2px; }
.dt ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14.5px; line-height: 1.55; }
.dt .uses { display: grid; gap: 8px; }
.dt .use { display: grid; gap: 3px; text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px;
  background: color-mix(in srgb, var(--ink) 4.5%, var(--surface)); }
.dt .use:active { background: color-mix(in srgb, var(--ink) 9%, var(--surface)); }
.dt .use .k { font-size: 16px; font-weight: 500; line-height: 1.6; }
.dt .use .e { font-family: var(--f-latin); font-size: 13.5px; color: var(--muted); }
.dt .use mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 700; }
.dt.v .use mark { background: none; padding: 0; text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.dt .use .go { font: 500 11px var(--f-mono); color: var(--accent); }

    var o = locOv(d); if (!o.overview) o = d.ov || {}; if (!o.overview) return "";
    var open = store.get("ovOpen", false);
    return '<section class="ov' + (open ? " open" : "") + '" id="ov"><div class="h"><span>' + T("about") + '</span>' +
      '<button data-ov="t">' + (open ? T("less") : T("more")) + '</button></div><p>' + fmtTr(o.overview) + '</p><dl>' +
      (o.setting ? '<dt>' + T("setting") + '</dt><dd>' + fmtTr(o.setting) + '</dd>' : "") +
      (o.register ? '<dt>' + T("formality") + '</dt><dd>' + fmtTr(o.register) + '</dd>' : "") +
      '<dt>' + T("items") + '</dt><dd>' + d.items.length + '<span style="color:var(--faint)"> · </span><button data-ov="x">' + T("seeAll") + '</button></dd></dl></section>';
  }
  function ovToggle(what) {
    if (what === "x") { openXp(false); return; }
    var el = $("ov"), open = !el.classList.contains("open");
    el.classList.toggle("open", open); el.querySelector("[data-ov=t]").textContent = open ? T("less") : T("more"); store.set("ovOpen", open);
  }

  // lock-screen controls
  function setMedia() {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: "서강팟캐스트", album: "EP " + (+ep.ep.slice(3)) });
      navigator.mediaSession.setActionHandler("play", function () { audio.play(); });
      navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); });
      navigator.mediaSession.setActionHandler("previoustrack", function () { $("prev").click(); });
      navigator.mediaSession.setActionHandler("nexttrack", function () { $("next").click(); });
      navigator.mediaSession.setActionHandler("seekbackward", function () { playFrom(audio.currentTime - 10); });
      navigator.mediaSession.setActionHandler("seekforward", function () { playFrom(audio.currentTime + 10); });
    } catch (e) {}
  }

  // search across every script, Korean or English
  var corpus = null, corpusL = {}, qTimer = null;
  function getJson(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { return r.json(); }); }
  // rows [ep, line, Korean, English]; search_<lang>.json holds the same rows' text in that language
  function loadCorpus() {
    if (!corpus) corpus = getJson("data/search.json");
    var lg = UL();
    if (lg === "en") return corpus;
    if (!corpusL[lg]) corpusL[lg] = getJson("data/search_" + lg + ".json").catch(function () { return []; });
    return Promise.all([corpus, corpusL[lg]]).then(function (a) { return a[0].map(function (r, i) { return [r[0], r[1], r[2], r[3], a[1][i] || ""]; }); });
  }
  function markText(text, q, ignoreSpaces) {
    var t = text, low = t.toLowerCase(), out = "", p = 0;
    if (ignoreSpaces) {
      var map = [], flat = ""; for (var i = 0; i < t.length; i++) if (t[i] !== " ") { map.push(i); flat += t[i].toLowerCase(); }
      var qq = q.replace(/\s+/g, "").toLowerCase(), k = flat.indexOf(qq);
      if (k < 0 || !qq) return esc(t);
      var a = map[k], b = map[k + qq.length - 1] + 1;
      return esc(t.slice(0, a)) + "<mark>" + esc(t.slice(a, b)) + "</mark>" + esc(t.slice(b));
    }
    var ql = q.toLowerCase(), idx;
    while ((idx = low.indexOf(ql, p)) >= 0 && ql) { out += esc(t.slice(p, idx)) + "<mark>" + esc(t.slice(idx, idx + ql.length)) + "</mark>"; p = idx + ql.length; }
    return out + esc(t.slice(p));
  }
  function runSearch() {
    var q = $("q").value.trim();
    $("eps").hidden = !!q; $("lvl").hidden = !!q; $("results").hidden = !q;
    if (!q) return;
    loadCorpus().then(function (rows) {
      if ($("q").value.trim() !== q) return;
      var ko = /[\u3131-\u318F\uAC00-\uD7A3]/.test(q), qs = q.replace(/\s+/g, "").toLowerCase(), ql = q.toLowerCase(), hits = [];
      var plain = function (t) { return (t || "").replace(/\*/g, ""); };
      for (var i = 0; i < rows.length && hits.length < 120; i++) {
        var r = rows[i];
        if (ko) { if (r[2].replace(/\s+/g, "").toLowerCase().indexOf(qs) >= 0) hits.push([r[0], r[1], r[2], plain(r[4] || r[3])]); continue; }
        // the chosen language first, English as a fallback (so English still finds lines when another language is on)
        if (r[4] && plain(r[4]).toLowerCase().indexOf(ql) >= 0) hits.push([r[0], r[1], r[2], plain(r[4])]);
        else if (plain(r[3]).toLowerCase().indexOf(ql) >= 0) hits.push([r[0], r[1], r[2], plain(r[3])]);
      }
      var byEp = {}; index.forEach(function (e) { byEp[e.ep] = e; });
      $("results").innerHTML = '<p class="meta">' + T("lines", { n: hits.length >= 120 ? "120+" : hits.length }) + '</p>' + hits.map(function (r) {
        var e = byEp[r[0]] || {};
        return '<button class="hit" data-ep="' + r[0] + '" data-i="' + r[1] + '"><span class="where"><b>EP ' + String(e.n).padStart(2, "0") + '</b> · ' + esc(e.title || "") + (e.ready ? "" : " · " + T("scriptOnly")) + '</span>' +
          '<span class="k">' + (ko ? markText(r[2], q, true) : esc(r[2])) + '</span><span class="e">' + (ko ? esc(r[3]) : markText(r[3], q, false)) + '</span></button>';
      }).join("") || '<p class="meta">' + T("noMatch", { q: esc(q) }) + '</p>';
    });
  }
  $("q").addEventListener("input", function () { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 160); });
  $("q").addEventListener("focus", loadCorpus);
  $("results").addEventListener("click", function (ev) {
    var h = ev.target.closest(".hit"); if (h) openEp(h.dataset.ep, +h.dataset.i);
  });

  var BUILD = document.documentElement.dataset.build || "";
  function checkUpdate() {
    if (!BUILD) return;
    fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (v) {
      if (v.build && v.build !== BUILD && audio.paused) location.reload();
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkUpdate(); });
  $("refresh").addEventListener("click", function () {
    this.classList.add("spin");
    fetch("index.html?t=" + Date.now(), { cache: "reload" }).catch(function () {}).then(function () { location.reload(); });
  });
  setTimeout(checkUpdate, 1500);
  fetch("data/index.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) { index = d; renderList(); })
    .catch(function () { $("eps").innerHTML = '<p class="lede">' + T("loadFail") + '</p>'; });
})();
</script>
</body>
</html>
