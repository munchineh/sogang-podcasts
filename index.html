[hidden] { display: none !important; }
html, body { height: 100%; }
:root { --dim: color-mix(in srgb, var(--ink) 32%, transparent); }
/* translated episode titles (list cards, player bar): a step quieter than --muted, still readable */
:root { --sub: color-mix(in srgb, var(--muted) 40%, var(--faint)); }
/* floating surfaces (desktop player bar): soft two-layer lift; dark needs real black to show against --bg */
:root { --float-shadow: 0 1px 2px rgba(23,24,31,.05), 0 8px 28px rgba(23,24,31,.09); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --float-shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 32px rgba(0,0,0,.42); } }
:root[data-theme="dark"] { --float-shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 32px rgba(0,0,0,.42); }
html[data-tr="ja"] { --f-latin: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans KR", sans-serif;
  --f-body: "Dots", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans KR", -apple-system, sans-serif; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: anywhere;  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; /* Mac browsers drew text heavier than iPhone */ }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
/* keyboard focus ring follows each control's own shape (it used to force a 10px radius, which squared off the round play button) */
button:focus-visible, .line:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.line:focus-visible { border-radius: 16px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(var(--edge), env(safe-area-inset-left, 0px)); padding-right: max(var(--edge), env(safe-area-inset-right, 0px)); }
.sheet .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- episode list ---------- */
/* no default 8px margin at the top of the page: in search mode and at the top of an episode the top bar must sit right on the
   top edge, or iOS 26 draws its soft blur under the status bar (WebKit only skips it for a solid bar touching the edge) */
body { margin-top: 0; }
/* --top-gap (20 Oct): the one space between the top edge (below the status bar) and the first thing you see, on the home page
   and the episode page, phone and desktop. Each rule subtracts the empty space its first element carries above its visible
   top (logo bubble ~5px inside its box, the EP label's letters ~12px inside the header row with Noto Sans KR). */
:root { --top-gap: 20px; }
#list { padding-block: calc(env(safe-area-inset-top, 0px) + var(--top-gap) - 6px) 48px; }
.mast { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding-inline: 8px; }
.mast .tools { margin-left: auto; display: flex; align-items: center; gap: 4px; margin-right: -6px; }
.mast .refresh { color: var(--muted); }
.mast .lang { color: var(--muted); font-family: var(--f-latin); display: inline-flex; align-items: center; gap: 5px; padding: 0 11px 0 9px; }
.mast .lang svg { width: 16px; height: 16px; }
.mast .lang[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.mast .refresh.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.logo { width: 64px; height: 64px; flex: none; overflow: visible; margin-left: -4px; }
.logo .lg { font: 900 150px "Noto Sans KR", sans-serif; fill: #fff; text-anchor: middle; }
.logo .b2f { fill: var(--ink); stroke: var(--bg); stroke-width: 32px; paint-order: stroke; }
.logo .b2 text { fill: var(--bg); }
/* logo (7s loop): 서 springs in, 강 follows, both hold; 강 then 서 pop out (quick swell, snap to nothing),
   and 서 springs straight back in. Scale only, no fades. */
.logo .b1 { transform-origin: 90px 300px; animation: lgpop 7s infinite; }
.logo .b2 { transform-origin: 440px 464px; animation: lgpop2 7s infinite; }
@keyframes lgpop {
  0% { transform: scale(0); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  3% { transform: scale(1.18); animation-timing-function: ease-in-out; }
  5% { transform: scale(.93); animation-timing-function: ease-in-out; }
  7% { transform: scale(1.03); animation-timing-function: ease-in-out; }
  8.5%, 93% { transform: scale(1); animation-timing-function: ease-out; }
  95% { transform: scale(1.16); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
  97%, 100% { transform: scale(0); } }
@keyframes lgpop2 {
  0%, 6% { transform: scale(0); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  9% { transform: scale(1.18); animation-timing-function: ease-in-out; }
  11% { transform: scale(.93); animation-timing-function: ease-in-out; }
  13% { transform: scale(1.03); animation-timing-function: ease-in-out; }
  14.5%, 89% { transform: scale(1); animation-timing-function: ease-out; }
  91% { transform: scale(1.16); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
  93%, 100% { transform: scale(0); } }
@media (prefers-reduced-motion: reduce) { .logo .b1, .logo .b2 { animation: none; } }
.mast h1 { font: 800 clamp(24px, 7vw, 32px)/1.15 "Poppins", var(--f-display); margin: 0; letter-spacing: -.025em; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.mast .tools { flex: none; }   /* the buttons never get squeezed; a long wordmark (ポッドキャスト, Podcastler) shrinks instead, see fitMast */
.mast .count { font: 500 12px var(--f-mono); color: var(--muted); }
.lede { color: var(--muted); font-size: 14px; font-family: var(--f-latin); margin: 0 0 15px; padding-inline: 8px; }
.lvpick { position: relative; display: inline-flex; align-items: center; gap: 6px; }
.lvpick select { -webkit-appearance: none; appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font: 600 14px var(--f-body); letter-spacing: 0; text-transform: none; height: var(--pill-h); padding: 0 34px 0 14px; border-radius: 999px; }
.lvpick select { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
@media (hover: hover) { .lvpick select:hover { background-color: color-mix(in srgb, var(--ink) 4%, var(--surface)); } }
/* no browser focus ring after a mouse/touch open (it stayed lit once the menu closed); keyboard focus gets a soft accent ring
   in the same style as the held scrubber */
.lvpick select:focus { outline: none; }
.lvpick select:focus-visible { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.lvpick svg { position: absolute; right: 12px; width: 14px; height: 14px; pointer-events: none; color: var(--muted); }
/* 28 Oct (Mancini): the ready count became a Filter pill; it opens the Type / Book / Unit row of the Grammar & Vocab sheet */
.lfbtn { flex: none; height: var(--pill-h); padding: 0 14px 0 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font: 600 14px var(--f-body); letter-spacing: 0; text-transform: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lfbtn svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
/* cl_169 (Mancini): no fill and grey while nothing is chosen and the row is closed; white like the Level pill once it's open or a
   filter is on (the Level pill is always white: a level is always chosen) */
.lfbtn { background: transparent; color: var(--ink); transition: background-color .2s ease, color .2s ease, transform .5s var(--spring); }
.lfbtn.on, .lfbtn[aria-expanded="true"] { background: var(--surface); color: var(--ink); }
.lfbtn.on svg, .lfbtn[aria-expanded="true"] svg { color: var(--ink); }
.lfbtn:active { transform: scale(.96); transition: transform .1s ease-out; }
.eps .xpf.lf { margin: 6px 0 0; }   /* cl_171: tighter (was 8px) */
/* 28 Oct (Mancini): the level picker, Filter pill and filter row stick right under the search bar as one group, with one
   hairline under the whole group once cards pass beneath (the search bar's own hairline is off while this one shows) */
.lvbar { position: sticky; top: var(--sbh, 64px); z-index: 2; background: var(--bg); margin-inline: calc(-1 * var(--edge)); padding: 0 var(--edge) 5px;
  border-bottom: 1px solid transparent; transition: border-color .2s ease; }
.lvbar.stuck { border-bottom-color: var(--rule); }
.lvbar .lvl.pick { margin-bottom: 0; }
#eps #lvbar > h2.lvl { margin: 3px 0 0; }   /* cl_172: 16 px from the search field, 16 px to the first card (Mancini) */
.lvbar, .lvbar .xpf.lf { min-width: 0; }   /* cl_168: the row is never wider than the screen, so long labels (Zurücksetzen) switch Clear to the round x instead of overlapping Sort */
.xpf.tight { gap: 4px; } .xpf.tight .dd { padding: 0 6px 0 10px; }   /* and the pills draw in a little (German: Grammatik, Lektion) */
/* while filtering: matching items on each card, after the EP number (accent from 1, faded grey at 0) */
.ep .no .hc { display: inline-block; margin-left: 8px; height: 20px; padding: 0 7px; border-radius: 8px; font: 600 10.5px/20px var(--f-mono); letter-spacing: .02em;
  color: var(--accent); background: var(--accent-soft); vertical-align: 1px; white-space: nowrap; }
.ep .no .hc.z { color: var(--faint); background: color-mix(in srgb, var(--ink) 6%, transparent); }
@supports (text-box: trim-both cap alphabetic) { .ep .no .hc { box-sizing: border-box; line-height: 1; text-box: trim-both cap alphabetic; padding-block: calc((20px - 1cap) / 2); } }
.xpf .clr { white-space: nowrap; flex: none; }   /* "Clear" never breaks in two (desktop sidebar): too narrow, it becomes the round x */
.eps .xpf.lf .pop { top: calc(var(--pill-h) + 6px); }
.eps .lfnone { padding: 28px 4px; text-align: center; color: var(--muted); font-size: 14px; }
/* sort pill at the right end of the filter row: an icon (episode order / most matches) and a chevron */
.eps .xpf.lf .srt { margin-left: auto; padding: 0 8px 0 9px; gap: 3px; }
.eps .xpf.lf .clr:not([hidden]) + .srt { margin-left: 2px; }
.eps .xpf.lf .srt svg.sic { width: 18px; height: 18px; color: var(--ink); }
.eps .xpf.lf .srt.on svg.sic { color: var(--accent); }
.eps .xpf.lf .srt svg.sic, .eps .xpf.lf .srt[aria-expanded="true"] svg.sic { transform: none; }   /* only the chevron turns */
.eps .xpf.lf .pop.sp { min-width: 0; white-space: nowrap; }
.eps .xpf.lf .pop.sp button { justify-content: flex-start; gap: 10px; padding: 0 14px 0 10px; }

/* expressions sheet */
/* Sheets (17 Oct, smoother): the dim is a composited ::before fading its opacity (was a full-screen background-color
   transition, repainted every frame); the panel slides on its own GPU layer (translate3d, contain) with the iOS sheet
   curve over .44s (was .58s with a long tail); the continuous-corner mask is no longer on the moving panel. */
.sheet { position: fixed; inset: 0; z-index: 6; display: flex; align-items: flex-end; --sheet-ease: cubic-bezier(.32,.72,0,1); }
.sheet::before { content: ""; position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .3s ease; will-change: opacity; }
.sheet.open::before { opacity: 1; }
.sheet.closing { pointer-events: none; }
.sheet.closing::before { transition-duration: .22s; }
.sheet .panel { position: relative; z-index: 1; transform: translate3d(0, 100%, 0); transition: transform .44s var(--sheet-ease), opacity .24s ease, height .34s var(--spring-sheet);
  will-change: transform; backface-visibility: hidden; contain: layout paint; }
.sheet.open .panel { transform: translate3d(0, 0, 0); }
.sheet.closing .panel { transition: transform .24s cubic-bezier(.4,0,1,1), opacity .2s ease; }
/* list ⇄ card: the dimmed backdrop stays put and the panels slide sideways */
.sheet.swap::before { transition: none; opacity: 1; }
.sheet.swap .panel { transform: translate3d(var(--dx, 28px), 0, 0); opacity: 0; transition: transform .42s var(--spring), opacity .2s ease, height .34s var(--spring-sheet); }
.sheet.swap.open::before { opacity: 1; }
.sheet.swap.open .panel { transform: translate3d(0, 0, 0); opacity: 1; }
.sheet.swap.closing::before { opacity: 0; transition: opacity .22s ease; }

@supports (-webkit-mask-box-image: none) {
  .ep, .ov, .transport { position: relative; isolation: isolate; background: transparent; border-color: transparent; }
  .transport { position: fixed; }
  .ep::before, .ov::before, .transport::before, .ep::after, .ov::after, .transport::after { content: ""; position: absolute; z-index: -1; pointer-events: none; }
  .ep::before, .ov::before { inset: -1px; background: var(--rule); -webkit-mask-box-image: var(--sq16); }
  .ep::after, .ov::after { inset: 0; background: var(--surface); -webkit-mask-box-image: var(--sq15); }
  .ep { box-shadow: none; filter: drop-shadow(0 1px 1px rgba(23,24,31,.05)); }
  .transport::before { inset: -1px -1px 0; background: var(--rule); -webkit-mask-box-image: var(--sqt22); }
  .transport::after { inset: 0; background: var(--surface); -webkit-mask-box-image: var(--sqt21); }
  .transport { box-shadow: none; filter: drop-shadow(0 -6px 14px rgba(10,10,20,.06)); }
  /* (sheets keep plain rounded corners: a mask on a sliding layer made iOS re-rasterise it every frame) */
}

/* ---------- Desktop (17 Oct): two panels from 1024px. Phones and narrow windows are unchanged.
   Left: the episode list (its own scroll), always visible, current episode marked. Right: the episode (the window scrolls it).
   Grammar/vocab cards float in from the right, rounded on all corners, over a scrim that blocks the page and pauses audio. */
@media (min-width: 1024px), (orientation: landscape) and (min-width: 780px) and (pointer: coarse) {   /* 25 Oct: + an unfolded foldable (Fold8 ≈932×704, Fold8 Ultra ≈954×859); cl_197: 780 px for the iPhone Duo Home Screen app (≈870 wide) */
  :root { --side: 340px; }
  #list, #list[hidden] { display: block !important; position: fixed; top: 0; bottom: 0; left: 0; width: var(--side); max-width: none; margin: 0;
    overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 32px; border-right: 1px solid var(--rule); background: var(--bg); z-index: 4;
    box-sizing: border-box; }
  body.searching #list { padding-top: 0; }
  /* the list's top space sits on its header, so the sticky search bar meets the very top edge (cards no longer show above it);

  #list > .hdr { padding-top: calc(var(--top-gap) - 5px); }   /* desktop logo is 52px: its bubble starts ~5px inside */
  #list .logo { width: 52px; height: 52px; margin-left: -2px; }
  #list .mast { gap: 10px; }
  #list .mast h1 { font-size: 26px; }

  /* (episode cards keep the phone layout: summary shown, same padding) */

  #list .ep.cur, #list .ep.cur:hover { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  #list .ep.cur .no { color: var(--accent); }
  #list .ep:hover, #list .ep:hover::after { background-color: color-mix(in srgb, var(--ink) 3%, var(--surface)); }

/* ---------- cl_198 (29 Oct, Mancini): unfolded foldables. Three panels on a strip, two in view, each half the screen:
   A = list | script, B = script | Grammar & Vocab. --fx (0 = A, 1 = B) is animated with the big-panel spring, and every
   position is derived from it, so the strip slides as one piece and the script keeps its width. */
@property --fx { syntax: '<number>'; inherits: true; initial-value: 0; }
#navbtn { display: none; }
:root { --sr-dbg: env(safe-area-inset-right, 0px); }
@media (pointer: coarse) and (orientation: landscape) and (min-width: 780px) and (max-width: 1023px) and (max-aspect-ratio: 9/5) {
  :root { --half: 50vw; }
  @media (horizontal-viewport-segments: 2) { :root { --half: env(viewport-segment-right 0 0, 50vw); } }
  html { zoom: 1; }
  body { --fx: 0;   /* cl_203: no longer animated (that re-laid out the script every frame); the panels glide on transforms */
    --side: calc((1 - var(--fx)) * var(--half)); --rail: calc(var(--fx) * (100vw - var(--half))); }
  body.foldb { --fx: 1; }
  body.foldnow { transition: none; }
  #list, #list[hidden] { width: var(--half); transform: translate3d(calc(var(--fx) * -100%), 0, 0);
    transition: transform .55s var(--spring-fold, var(--spring-sheet, cubic-bezier(.32,.72,0,1))); }
  #player { margin-left: var(--side); margin-right: var(--rail); }
  .sheet { width: calc(100vw - var(--half)); }   /* cl_206: position below, per state */
  .transport { left: calc(var(--side) + var(--tm, 22px)); right: calc(var(--rail) + var(--tm, 22px)); max-width: none; margin-inline: 0; }
  /* half a screen is phone-sized: the bar sits close to the panel edges and its controls spread like the phone's */

  #navbtn { display: grid; position: relative; top: 4px; margin-left: -6px; color: var(--muted); }
  #navbtn:active { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
  body:not(.foldb) #navbtn { display: none; }   /* cl_201: only while the list is out of view */
  #xpbtn, .sidefoot { display: none !important; }

  .sheet .panel { border-width: 0 0 0 1px; border-radius: 0; background: var(--bg); }

  body.foldnow #list, body.foldnow .sheet { transition: none; }
}
